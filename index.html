<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">
<title>每日体重</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#4f6ef7;
  --primary-soft:#e9edff;
  --text:#1c2130; --text2:#7a8299; --text3:#b3bacb;
  --bg:#f4f5fb; --card:#fff; --line:#edf0f7;
  --up:#f0506e; --down:#0eb582;
  --pm:#ef8b3d;
  --pm-soft:#fff2e5;
  --shadow-card:0 1px 2px rgba(28,33,48,.04),0 8px 24px rgba(28,33,48,.06);
  --shadow-float:0 4px 12px rgba(28,33,48,.08),0 16px 40px rgba(28,33,48,.10);
  --radius:20px;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
  background:
    radial-gradient(900px 480px at 110% -60px, rgba(124,92,245,.10), transparent 60%),
    radial-gradient(700px 420px at -80px 20%, rgba(79,110,247,.12), transparent 55%),
    radial-gradient(600px 500px at 50% 110%, rgba(14,181,130,.05), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{font-family:inherit}
.app{max-width:480px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom))}

/* 入场动画 */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.hero{animation:fadeUp .45s ease both}
.stats{animation:fadeUp .45s .06s ease both}
.app > .card:nth-of-type(1){animation:fadeUp .45s .12s ease both}
.app > .card:nth-of-type(2){animation:fadeUp .45s .18s ease both}
.app > .card:nth-of-type(3){animation:fadeUp .45s .24s ease both}

/* ---------- 顶部卡片 ---------- */
.hero{
  position:relative;overflow:hidden;color:#fff;
  border-radius:24px;padding:24px 22px 22px;
  background:linear-gradient(140deg,#5a74f8 0%,#6a5cf6 55%,#8a5bf0 100%);
  box-shadow:0 12px 32px rgba(90,116,248,.35),0 2px 6px rgba(90,116,248,.18);
}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.hero::before{right:-56px;top:-64px;width:190px;height:190px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.20),rgba(255,255,255,.05) 65%,transparent)}
.hero::after{left:-40px;bottom:-90px;width:170px;height:170px;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 65%)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.hero-label{font-size:13px;font-weight:500;opacity:.9;letter-spacing:.5px}
.hero-weight{font-size:48px;font-weight:700;line-height:1.12;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-1px;text-shadow:0 2px 12px rgba(30,30,80,.18)}
.hero-weight .unit{font-size:17px;font-weight:500;opacity:.8;margin-left:3px;letter-spacing:0}
.hero-delta{font-size:13px;margin-top:5px;display:flex;align-items:center;gap:4px;min-height:19px;font-weight:500}
.streak{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
  border-radius:16px;padding:10px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.streak svg{flex-shrink:0;opacity:.95}
.streak-num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.streak-label{font-size:10.5px;opacity:.85;line-height:1.3;margin-top:1px}

/* ---------- 统计行 ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.stat{
  background:var(--card);border-radius:18px;padding:13px 8px 12px;text-align:center;
  box-shadow:var(--shadow-card);
  border:1px solid rgba(255,255,255,.8);
  position:relative;overflow:hidden;
}
.stat::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(79,110,247,.18),transparent)}
.stat-head{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--text2)}
.stat-head svg{flex-shrink:0}
.stat-value{font-size:18px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.3px;transition:color .2s}
.stat-value.up{color:var(--up)}
.stat-value.down{color:var(--down)}

/* ---------- 通用卡片 ---------- */
.card{
  background:var(--card);border-radius:var(--radius);padding:18px 16px 16px;margin-top:14px;
  box-shadow:var(--shadow-card);
}
.card-title{font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;letter-spacing:.2px}
.card-title .sub{font-size:11px;color:var(--text3);font-weight:400}
.title-right{display:flex;align-items:center;gap:12px}
.note-toggle{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer}

/* 开关 */
.switch{position:relative;width:40px;height:23px;display:inline-block;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:#dde1ee;border-radius:12px;transition:background .22s}
.switch .track::after{content:'';position:absolute;left:2.5px;top:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.34,1.4,.64,1);box-shadow:0 2px 5px rgba(28,33,48,.28)}
.switch input:checked + .track{background:var(--primary)}
.switch input:checked + .track::after{transform:translateX(17px)}

/* ---------- 趋势图 ---------- */
.chart-wrap{position:relative;margin-top:8px}
.chart-wrap svg{display:block;width:100%;touch-action:pan-y}
.chart-empty{padding:38px 0 32px;text-align:center;color:var(--text3);font-size:13px;line-height:1.8}
.chart-legend{display:flex;justify-content:flex-end;gap:8px;font-size:11px;color:var(--text2);margin-top:4px}
.chart-legend span{display:flex;align-items:center;justify-content:center;background:#f6f7fc;border-radius:20px;padding:5px 9px;font-weight:500}
.chart-legend svg{width:14px;height:14px;display:block}
.tip{
  position:absolute;background:rgba(24,27,42,.94);color:#fff;font-size:12px;font-weight:500;
  padding:5px 11px;border-radius:10px;transform:translate(-50%,-140%);
  white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;
  font-variant-numeric:tabular-nums;z-index:2;backdrop-filter:blur(4px);
  box-shadow:0 6px 18px rgba(24,27,42,.35);
}
.tip.show{opacity:1}

/* ---------- 录入 ---------- */
.field-row{display:flex;gap:10px;margin-top:14px}
.field{flex:1;min-width:0}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:7px;font-weight:500}
.field input[type=date]{
  width:100%;height:46px;border:1.5px solid var(--line);border-radius:13px;
  padding:0 10px;font-size:16px;color:var(--text);background:#f8f9fd;outline:none;
  -webkit-appearance:none;appearance:none;transition:border-color .15s,background .15s,box-shadow .15s;
}
.field input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(79,110,247,.14)}
.field input[type=text]{
  width:100%;height:46px;border:1.5px solid var(--line);border-radius:13px;
  padding:0 13px;font-size:15px;color:var(--text);background:#f8f9fd;outline:none;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
.field input[type=text]:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(79,110,247,.14)}
.field input[type=text]::placeholder{color:var(--text3)}
.seg{display:flex;height:46px;border:1.5px solid var(--line);border-radius:13px;overflow:hidden;background:#f8f9fd;padding:3px;gap:3px}
.seg-btn{flex:1;font-size:14.5px;color:var(--text2);border-radius:9px;transition:all .18s;font-weight:500;display:flex;align-items:center;justify-content:center}
.seg-btn svg{width:19px;height:19px;display:block}
.seg-btn.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(79,110,247,.35)}
.stepper{display:flex;align-items:stretch;height:46px}
.step-btn{
  width:44px;border:1.5px solid var(--line);background:#f8f9fd;border-radius:13px;
  font-size:21px;color:var(--text2);display:flex;align-items:center;justify-content:center;
  transition:all .15s;font-weight:400;line-height:1;
}
.step-btn:active{background:var(--primary-soft);color:var(--primary);transform:scale(.94)}
.stepper input{
  flex:1;min-width:0;border:1.5px solid var(--line);border-left:none;border-right:none;
  background:#f8f9fd;text-align:center;font-size:18px;font-weight:600;color:var(--text);outline:none;
  -moz-appearance:textfield;appearance:textfield;transition:background .15s;
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper input:focus{background:#fff}
.stepper input::placeholder{font-weight:400;color:var(--text3)}
.hint{font-size:12px;color:var(--primary);margin-top:9px;min-height:17px;font-weight:500}
.save-btn{
  width:100%;height:50px;margin-top:12px;border-radius:15px;
  background:linear-gradient(135deg,#5a74f8,#7a5bf0);
  color:#fff;font-size:16px;font-weight:600;letter-spacing:1px;
  box-shadow:0 8px 20px rgba(90,116,248,.38),0 2px 6px rgba(90,116,248,.22);
  transition:transform .12s,box-shadow .12s;
  position:relative;overflow:hidden;
}
.save-btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}80%,100%{left:130%}}
.save-btn:active{transform:scale(.965);box-shadow:0 4px 12px rgba(90,116,248,.32)}

/* ---------- 历史记录 ---------- */
.history{list-style:none;margin-top:4px}
.history > li{padding:13px 0;border-bottom:1px solid var(--line)}
.history > li:last-child{border-bottom:none}
.history-row{display:flex;align-items:center}
.history-note{
  font-size:12px;color:var(--text2);border-radius:10px;
  padding:7px 11px;margin-top:9px;line-height:1.55;word-break:break-word;
  background:#f6f7fc;border-left:3px solid var(--text3);
}
.history-note.am{background:#f0f3ff;border-left-color:var(--primary)}
.history-note.pm{background:var(--pm-soft);border-left-color:var(--pm)}
.history-date{width:104px}
.hd-main{display:block;font-size:15px;font-weight:600;letter-spacing:.2px}
.hd-sub{display:block;font-size:11px;color:var(--text3);margin-top:2px}
.slot-tag{
  display:inline-flex;align-items:center;justify-content:center;
  width:23px;height:23px;border-radius:8px;margin-left:6px;
  vertical-align:-4px;
}
.slot-tag svg{width:13px;height:13px;display:block}
.slot-tag.am{background:var(--primary-soft);color:var(--primary)}
.slot-tag.pm{background:var(--pm-soft);color:var(--pm)}
.history-weight{flex:1;text-align:right;font-variant-numeric:tabular-nums}
.hw-main{font-size:18px;font-weight:700;letter-spacing:-.3px}
.hw-unit{font-size:11px;color:var(--text3);margin-left:3px;font-weight:400}
.history-delta{width:66px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.history-delta.up{color:var(--up)}
.history-delta.down{color:var(--down)}
.history-delta.flat{color:var(--text3);font-weight:400}
.del-btn{
  width:36px;height:36px;margin-left:6px;border-radius:11px;color:var(--text3);
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.del-btn:active{background:#fdecef;color:var(--up);transform:scale(.9)}
.empty{padding:36px 0 32px;text-align:center;color:var(--text3);font-size:13px;line-height:1.9}
.empty svg{display:block;margin:0 auto 8px;opacity:.5}

/* ---------- 弹窗与提示 ---------- */
.modal-mask{
  position:fixed;inset:0;background:rgba(18,21,34,.5);
  display:flex;align-items:center;justify-content:center;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .2s;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{
  width:80%;max-width:310px;background:#fff;border-radius:22px;
  padding:26px 22px 18px;transform:scale(.88) translateY(10px);
  transition:transform .22s cubic-bezier(.34,1.3,.64,1);
  box-shadow:var(--shadow-float);
}
.modal-mask.show .modal{transform:scale(1) translateY(0)}
.modal-icon{width:52px;height:52px;border-radius:50%;background:#fdecef;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.modal-text{font-size:15px;text-align:center;line-height:1.6;color:var(--text)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{flex:1;height:44px;border-radius:13px;font-size:15px;transition:transform .12s}
.modal-actions button:active{transform:scale(.96)}
.modal-cancel{background:#f1f3f9;color:var(--text2);font-weight:500}
.modal-ok{background:linear-gradient(135deg,#f0506e,#e8445f);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(240,80,110,.35)}
.toast{
  position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);
  background:rgba(24,27,42,.94);color:#fff;font-size:13px;font-weight:500;
  padding:10px 20px;border-radius:15px;opacity:0;pointer-events:none;
  transition:all .25s cubic-bezier(.34,1.2,.64,1);z-index:60;white-space:nowrap;
  box-shadow:0 8px 24px rgba(24,27,42,.3);backdrop-filter:blur(4px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-label" id="heroLabel">最新体重</div>
        <div class="hero-weight"><span id="heroWeight">--</span><span class="unit">kg</span></div>
        <div class="hero-delta" id="heroDelta"></div>
      </div>
      <div class="streak">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        <div>
          <div class="streak-num" id="streakNum">0</div>
          <div class="streak-label">连续记录(天)</div>
        </div>
      </div>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <div class="stat-head"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#4f6ef7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>7天变化</div>
      <div class="stat-value" id="stat7">—</div>
    </div>
    <div class="stat">
      <div class="stat-head"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#8a5bf0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>累计变化</div>
      <div class="stat-value" id="statTotal">—</div>
    </div>
    <div class="stat">
      <div class="stat-head"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#0eb582" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 12l2 2 4-4"/></svg>记录次数</div>
      <div class="stat-value" id="statCount">0</div>
    </div>
  </section>

  <section class="card">
    <div class="card-title">体重趋势<span class="sub" id="chartSub"></span></div>
    <div class="chart-wrap" id="chartWrap">
      <div id="chart"></div>
      <div class="tip" id="chartTip"></div>
    </div>
  </section>

  <section class="card">
    <div class="card-title">记录体重</div>
    <div class="field-row">
      <div class="field" style="flex:1.15">
        <label for="dateInput">日期</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field">
        <label>时段</label>
        <div class="seg">
          <button type="button" class="seg-btn" id="segAm" aria-label="早晨记录" title="早晨记录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
          <button type="button" class="seg-btn" id="segPm" aria-label="晚上记录" title="晚上记录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="weightInput">体重 (kg)</label>
        <div class="stepper">
          <button class="step-btn" id="minusBtn" type="button">−</button>
          <input type="number" id="weightInput" inputmode="decimal" step="0.01" min="20" max="300" placeholder="65.75">
          <button class="step-btn" id="plusBtn" type="button">+</button>
        </div>
      </div>
    </div>
    <div class="field" style="margin-top:11px">
      <label for="noteInput">备注（可选）</label>
      <input type="text" id="noteInput" maxlength="100" placeholder="如：空腹、饭后、运动后">
    </div>
    <div class="hint" id="inputHint"></div>
    <button class="save-btn" id="saveBtn">保存记录</button>
  </section>

  <section class="card">
    <div class="card-title">历史记录<span class="title-right"><span class="sub" id="historySub"></span><label class="note-toggle">备注<span class="switch"><input type="checkbox" id="noteToggle"><span class="track"></span></span></label></span></div>
    <ul class="history" id="historyList"></ul>
    <div class="empty" id="historyEmpty" hidden>
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      还没有记录<br>记下第一笔开始吧
    </div>
  </section>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#f0506e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></div>
    <div class="modal-text" id="modalText"></div>
    <div class="modal-actions">
      <button class="modal-cancel" id="modalCancel">取消</button>
      <button class="modal-ok" id="modalOk">删除</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var STORE_KEY = 'weight-records-v1';
  var PREF_KEY = 'weight-prefs-v1';
  var WEEK = ['日','一','二','三','四','五','六'];
  var SLOT_NAME = { am:'早', pm:'晚' };
  // 早=太阳图标，晚=月亮图标（stroke 用 currentColor，随环境着色）
  var SLOT_ICON = {
    am: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>',
    pm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>'
  };

  var records = load();
  var showNotes = (function(){
    try{ return localStorage.getItem(PREF_KEY) === '1'; }catch(e){ return false; }
  })();

  /* ---------- 工具 ---------- */
  // 数据格式：[{date:'YYYY-MM-DD', am:{w,note?}, pm:{w,note?}}]，am/pm 均可缺省
  // 兼容旧格式 {date,weight,note}：自动迁移为该日的早记录
  function load(){
    var out = [], seen = {};
    try{
      var raw = localStorage.getItem(STORE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(arr)) return [];
      arr.forEach(function(r){
        if(!r || typeof r.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(r.date)) return;
        var rec = { date: r.date };
        if(typeof r.weight === 'number' && isFinite(r.weight)){
          // 旧格式 → 迁移为早记录
          rec.am = { w: Math.round(r.weight*100)/100 };
          if(typeof r.note === 'string' && r.note.trim()) rec.am.note = r.note.trim();
        }else{
          ['am','pm'].forEach(function(s){
            var e = r[s];
            if(e && typeof e.w === 'number' && isFinite(e.w)){
              var ent = { w: Math.round(e.w*100)/100 };
              if(typeof e.note === 'string' && e.note.trim()) ent.note = e.note.trim();
              rec[s] = ent;
            }
          });
        }
        if(!rec.am && !rec.pm) return;
        if(seen[rec.date]){
          if(rec.am) seen[rec.date].am = rec.am;
          if(rec.pm) seen[rec.date].pm = rec.pm;
        }else{
          seen[rec.date] = rec;
          out.push(rec);
        }
      });
    }catch(e){ return []; }
    out.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    return out;
  }
  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(records)); }
    catch(e){ toast('保存失败，浏览器存储不可用'); }
  }
  function sortRecords(){
    records.sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function findByDate(date){
    for(var i = 0; i < records.length; i++){ if(records[i].date === date) return records[i]; }
    return null;
  }
  // 展开为按时间排序的记录列表：同一天早在前、晚在后
  function allEntries(){
    var list = [];
    records.forEach(function(r){
      if(r.am) list.push({ date: r.date, slot: 'am', w: r.am.w, note: r.am.note });
      if(r.pm) list.push({ date: r.date, slot: 'pm', w: r.pm.w, note: r.pm.note });
    });
    return list;
  }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function parseDate(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function displayDate(s){ var d = parseDate(s); return (d.getMonth()+1) + '月' + d.getDate() + '日'; }
  function weekLabel(s){ return '周' + WEEK[parseDate(s).getDay()]; }
  // 保留最多 2 位小数，去掉末尾多余的 0（65.75 → "65.75"，65.5 → "65.5"）
  function fixed(v){
    var n = Math.round(v*100)/100;
    var s = n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
    return s === '-0' || s === '' ? '0' : s;
  }
  function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var toastTimer = null;
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  /* ---------- 渲染：顶部与统计 ---------- */
  function renderHero(){
    var entries = allEntries();
    var hw = document.getElementById('heroWeight');
    var hd = document.getElementById('heroDelta');
    var hl = document.getElementById('heroLabel');
    document.getElementById('streakNum').textContent = calcStreak();

    if(!entries.length){ hw.textContent = '--'; hl.textContent = '最新体重'; hd.textContent = '在下方记录第一笔吧'; return; }
    var last = entries[entries.length-1];
    hw.textContent = fixed(last.w);
    hl.innerHTML = '最新体重 <span style="display:inline-flex;align-items:center;vertical-align:-2px;opacity:.95">' + SLOT_ICON[last.slot] + '</span>';
    hl.querySelector('svg').style.width = '15px';
    hl.querySelector('svg').style.height = '15px';
    if(entries.length >= 2){
      var prev = entries[entries.length-2];
      var d = last.w - prev.w;
      hd.innerHTML = '较上次(' + SLOT_NAME[prev.slot] + ') ' + deltaHTML(d) + ' kg';
    }else{
      hd.textContent = '继续记录，看变化';
    }
  }

  function deltaHTML(d){
    var v = Math.round(d*100)/100;
    if(v > 0) return '<span style="color:#ffd9df">▲' + fixed(v) + '</span>';
    if(v < 0) return '<span style="color:#ccf4e6">▼' + fixed(Math.abs(v)) + '</span>';
    return '<span>0</span>';
  }

  function calcStreak(){
    if(!records.length) return 0;
    var set = {};
    records.forEach(function(r){ set[r.date] = 1; });
    var d = new Date();
    if(!set[fmtDate(d)]){
      d.setDate(d.getDate()-1);
      if(!set[fmtDate(d)]) return 0;
    }
    var n = 0;
    while(set[fmtDate(d)]){ n++; d.setDate(d.getDate()-1); }
    return n;
  }

  function setStat(id, d, has){
    var el = document.getElementById(id);
    if(!has){ el.textContent = '—'; el.className = 'stat-value'; return; }
    var v = Math.round(d*100)/100;
    if(v > 0){ el.textContent = '+' + fixed(v); el.className = 'stat-value up'; }
    else if(v < 0){ el.textContent = fixed(v); el.className = 'stat-value down'; }
    else{ el.textContent = '0'; el.className = 'stat-value'; }
  }

  function renderStats(){
    var entries = allEntries();
    document.getElementById('statCount').textContent = entries.length;
    if(entries.length < 2){
      setStat('stat7', 0, false);
      setStat('statTotal', 0, false);
      return;
    }
    var last = entries[entries.length-1];
    setStat('statTotal', last.w - entries[0].w, true);

    // 7天变化：找距最新记录 7 天前（含更早）最近的一次
    var limit = parseDate(last.date); limit.setDate(limit.getDate()-7);
    var limitStr = fmtDate(limit);
    var base = null;
    for(var i = entries.length-1; i >= 0; i--){ if(entries[i].date <= limitStr){ base = entries[i]; break; } }
    setStat('stat7', base ? last.w - base.w : 0, !!base);
  }

  /* ---------- 渲染：趋势图（早/晚双曲线） ---------- */
  var chartPoints = [];

  function renderChart(){
    var box = document.getElementById('chart');
    var recent = records.slice(-30);
    var dates = recent.map(function(r){ return r.date; });
    var entryCount = 0;
    recent.forEach(function(r){ if(r.am) entryCount++; if(r.pm) entryCount++; });
    document.getElementById('chartSub').textContent = dates.length ? '最近' + dates.length + '天' : '';
    hideTip();
    chartPoints = [];

    if(entryCount < 2){
      box.innerHTML = '<div class="chart-empty">再记录 ' + (2 - entryCount) + ' 次即可生成趋势图</div>';
      return;
    }

    var W = box.clientWidth || 320, H = 190;
    var padL = 48, padR = 14, padT = 16, padB = 26;
    var weights = [];
    recent.forEach(function(r){ if(r.am) weights.push(r.am.w); if(r.pm) weights.push(r.pm.w); });
    var min = Math.min.apply(null, weights), max = Math.max.apply(null, weights);
    if(max - min < 1){ var mid = (max+min)/2; min = mid - 0.5; max = mid + 0.5; }
    var pad = (max-min) * 0.18; min -= pad; max += pad;

    function X(i){ return padL + (W-padL-padR) * (dates.length === 1 ? 0.5 : i/(dates.length-1)); }
    function Y(w){ return padT + (H-padT-padB) * (1 - (w-min)/(max-min)); }

    var amPts = [], pmPts = [];
    recent.forEach(function(r, i){
      if(r.am) amPts.push({ x: X(i), y: Y(r.am.w), date: r.date });
      if(r.pm) pmPts.push({ x: X(i), y: Y(r.pm.w), date: r.date });
    });
    chartPoints = amPts.concat(pmPts);
    var amLine = amPts.length >= 2 ? smoothPath(amPts) : '';
    var pmLine = pmPts.length >= 2 ? smoothPath(pmPts) : '';
    var amArea = amLine ? amLine + ' L ' + amPts[amPts.length-1].x + ' ' + (H-padB) + ' L ' + amPts[0].x + ' ' + (H-padB) + ' Z' : '';

    // 网格线与纵轴标签（取数据真实的最小/中/大值）
    var vals = [Math.min.apply(null, weights), (Math.min.apply(null, weights)+Math.max.apply(null, weights))/2, Math.max.apply(null, weights)];
    var grid = '';
    vals.forEach(function(v){
      var y = Y(v);
      grid += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eef0f7" stroke-width="1" stroke-dasharray="2 4"/>' +
              '<text x="'+(padL-8)+'" y="'+y+'" text-anchor="end" dominant-baseline="middle" font-size="10" fill="#b3bacb" font-weight="500">'+fixed(v)+'</text>';
    });

    // 横轴日期标签
    var xn = dates.length;
    var xlabels = '<text x="'+X(0)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="#b3bacb" font-weight="500">'+displayDate(dates[0])+'</text>';
    if(xn >= 6){
      var mi = Math.floor((xn-1)/2);
      xlabels += '<text x="'+X(mi)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="#b3bacb" font-weight="500">'+displayDate(dates[mi])+'</text>';
    }
    xlabels += '<text x="'+X(xn-1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="#b3bacb" font-weight="500">'+displayDate(dates[xn-1])+'</text>';

    function dotsOf(pts, color){
      return pts.map(function(p, i){
        var last = i === pts.length-1;
        return last
          ? '<circle cx="'+p.x+'" cy="'+p.y+'" r="4.5" fill="'+color+'" stroke="#fff" stroke-width="2"/>' +
            '<circle cx="'+p.x+'" cy="'+p.y+'" r="8" fill="none" stroke="'+color+'" stroke-width="1" opacity=".25"/>'
          : '<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="#fff" stroke="'+color+'" stroke-width="2"/>';
      }).join('');
    }

    var legend = '<div class="chart-legend">'
      + (amPts.length ? '<span style="color:#4f6ef7" title="早晨记录">' + SLOT_ICON.am + '</span>' : '')
      + (pmPts.length ? '<span style="color:#ef8b3d" title="晚上记录">' + SLOT_ICON.pm + '</span>' : '')
      + '</div>';

    box.innerHTML = legend +
      '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">' +
        '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="rgba(79,110,247,.20)"/><stop offset="1" stop-color="rgba(79,110,247,0)"/>' +
        '</linearGradient></defs>' +
        grid +
        (amArea ? '<path d="'+amArea+'" fill="url(#areaGrad)"/>' : '') +
        (amLine ? '<path d="'+amLine+'" fill="none" stroke="#4f6ef7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : '') +
        (pmLine ? '<path d="'+pmLine+'" fill="none" stroke="#ef8b3d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1 0"/>' : '') +
        '<line id="guideLine" y1="'+padT+'" y2="'+(H-padB)+'" x1="-10" x2="-10" stroke="#c6cdf2" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>' +
        dotsOf(amPts, '#4f6ef7') + dotsOf(pmPts, '#ef8b3d') + xlabels +
      '</svg>';
  }

  // Catmull-Rom 转贝塞尔平滑曲线
  function smoothPath(p){
    if(p.length < 3) return 'M ' + p[0].x + ' ' + p[0].y + ' L ' + p[1].x + ' ' + p[1].y;
    var d = 'M ' + p[0].x + ' ' + p[0].y;
    for(var i = 0; i < p.length-1; i++){
      var p0 = p[i-1] || p[i], p1 = p[i], p2 = p[i+1], p3 = p[i+2] || p2;
      d += ' C ' + (p1.x+(p2.x-p0.x)/6) + ' ' + (p1.y+(p2.y-p0.y)/6) +
           ' ' + (p2.x-(p3.x-p1.x)/6) + ' ' + (p2.y-(p3.y-p1.y)/6) +
           ' ' + p2.x + ' ' + p2.y;
    }
    return d;
  }

  /* 图表触摸提示 */
  var tipEl = document.getElementById('chartTip');
  function hideTip(){
    tipEl.classList.remove('show');
    var g = document.getElementById('guideLine');
    if(g) g.setAttribute('opacity', '0');
  }
  function chartPointer(e){
    if(!chartPoints.length) return;
    var svg = e.currentTarget.querySelector('svg');
    if(!svg) return;
    var rect = svg.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var best = -1, bd = Infinity;
    chartPoints.forEach(function(p, i){
      var d = Math.abs(p.x - x);
      if(d < bd){ bd = d; best = i; }
    });
    if(best < 0 || bd > 44){ hideTip(); return; }
    var p = chartPoints[best];
    var rec = findByDate(p.date);
    var txt = displayDate(p.date);
    if(rec){
      if(rec.am) txt += ' 早' + fixed(rec.am.w);
      if(rec.pm) txt += ' 晚' + fixed(rec.pm.w);
    }
    tipEl.textContent = txt + ' kg';
    tipEl.style.left = p.x + 'px';
    tipEl.style.top = p.y + 'px';
    tipEl.classList.add('show');
    var g = document.getElementById('guideLine');
    if(g){
      g.setAttribute('x1', p.x); g.setAttribute('x2', p.x);
      g.setAttribute('opacity', '1');
    }
  }
  var chartWrap = document.getElementById('chartWrap');
  chartWrap.addEventListener('pointermove', chartPointer);
  chartWrap.addEventListener('pointerdown', chartPointer);
  chartWrap.addEventListener('pointerleave', hideTip);
  chartWrap.addEventListener('pointercancel', hideTip);

  /* ---------- 渲染：历史列表 ---------- */
  var trashSVG = '<svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2zM6.5 9h11l-.9 11.2a1.5 1.5 0 0 1-1.5 1.3H8.9a1.5 1.5 0 0 1-1.5-1.3L6.5 9zm3.2 2v8h1.4v-8H9.7zm3.2 0v8h1.4v-8h-1.4z"/></svg>';

  function renderHistory(){
    var list = document.getElementById('historyList');
    var empty = document.getElementById('historyEmpty');
    var entries = allEntries();
    document.getElementById('historySub').textContent = entries.length ? '共' + entries.length + '条' : '';

    if(!entries.length){
      list.innerHTML = '';
      empty.hidden = false;
      return;
    }
    empty.hidden = true;

    var html = '';
    for(var i = entries.length-1; i >= 0; i--){
      var e = entries[i];
      var deltaHtml = '<span class="history-delta flat">—</span>';
      if(i > 0){
        var d = Math.round((e.w - entries[i-1].w)*100)/100;
        if(d > 0) deltaHtml = '<span class="history-delta up">▲' + fixed(d) + '</span>';
        else if(d < 0) deltaHtml = '<span class="history-delta down">▼' + fixed(Math.abs(d)) + '</span>';
        else deltaHtml = '<span class="history-delta flat">0</span>';
      }
      var noteHtml = (showNotes && e.note) ? '<div class="history-note ' + e.slot + '">' + escapeHTML(e.note) + '</div>' : '';
      html +=
        '<li>' +
          '<div class="history-row">' +
            '<div class="history-date"><span class="hd-main">' + displayDate(e.date) + '<span class="slot-tag ' + e.slot + '" title="' + SLOT_NAME[e.slot] + '记录">' + SLOT_ICON[e.slot] + '</span></span><span class="hd-sub">' + weekLabel(e.date) + '</span></div>' +
            '<div class="history-weight"><span class="hw-main">' + fixed(e.w) + '</span><span class="hw-unit">kg</span></div>' +
            deltaHtml +
            '<button class="del-btn" data-date="' + e.date + '" data-slot="' + e.slot + '" type="button" aria-label="删除">' + trashSVG + '</button>' +
          '</div>' +
          noteHtml +
        '</li>';
    }
    list.innerHTML = html;
  }

  /* ---------- 录入 ---------- */
  var dateInput = document.getElementById('dateInput');
  var weightInput = document.getElementById('weightInput');
  var noteInput = document.getElementById('noteInput');
  var saveBtn = document.getElementById('saveBtn');
  var inputHint = document.getElementById('inputHint');
  var segAm = document.getElementById('segAm');
  var segPm = document.getElementById('segPm');
  // 默认按时段选择：中午 12 点前默认"早"，之后默认"晚"
  var currentSlot = (new Date()).getHours() < 12 ? 'am' : 'pm';

  function setSlot(slot){
    currentSlot = slot;
    segAm.classList.toggle('active', slot === 'am');
    segPm.classList.toggle('active', slot === 'pm');
    syncInputForDate();
  }
  segAm.addEventListener('click', function(){ setSlot('am'); });
  segPm.addEventListener('click', function(){ setSlot('pm'); });

  function syncInputForDate(){
    var rec = findByDate(dateInput.value);
    var e = rec ? rec[currentSlot] : null;
    if(e){
      weightInput.value = fixed(e.w);
      noteInput.value = e.note || '';
      inputHint.textContent = '该日期' + SLOT_NAME[currentSlot] + '记录已存在，保存后将更新';
      saveBtn.textContent = '更新记录';
    }else{
      weightInput.value = '';
      noteInput.value = '';
      inputHint.textContent = '';
      saveBtn.textContent = '保存记录';
    }
  }

  function stepWeight(d){
    var v = parseFloat(weightInput.value);
    if(!isFinite(v)){
      var entries = allEntries();
      v = entries.length ? entries[entries.length-1].w : 60;
    }
    v = Math.round((v+d)*100)/100;
    v = Math.min(300, Math.max(20, v));
    weightInput.value = fixed(v);
  }
  document.getElementById('minusBtn').addEventListener('click', function(){ stepWeight(-0.1); });
  document.getElementById('plusBtn').addEventListener('click', function(){ stepWeight(0.1); });
  dateInput.addEventListener('change', syncInputForDate);

  function onSave(){
    var date = dateInput.value;
    var w = parseFloat(weightInput.value);
    if(!date){ toast('请选择日期'); return; }
    if(!isFinite(w) || w < 20 || w > 300){ toast('请输入 20~300 之间的体重'); return; }
    var weight = Math.round(w*100)/100;
    var note = noteInput.value.trim();
    var rec = findByDate(date);
    var updated = !!(rec && rec[currentSlot]);
    if(!rec){ rec = { date: date }; records.push(rec); }
    rec[currentSlot] = note ? { w: weight, note: note } : { w: weight };
    sortRecords();
    persist();
    toast(updated ? '已更新 ' + displayDate(date) + ' 的' + SLOT_NAME[currentSlot] + '记录' : '记录成功，继续保持！');
    renderAll();
    dateInput.value = fmtDate(new Date());
    syncInputForDate();
  }
  saveBtn.addEventListener('click', onSave);
  weightInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') onSave(); });

  /* ---------- 删除（按日期+时段） ---------- */
  var modalMask = document.getElementById('modalMask');
  var modalText = document.getElementById('modalText');
  var pendingDate = null;
  var pendingSlot = null;

  document.getElementById('historyList').addEventListener('click', function(e){
    var btn = e.target.closest('.del-btn');
    if(!btn) return;
    pendingDate = btn.getAttribute('data-date');
    pendingSlot = btn.getAttribute('data-slot');
    modalText.textContent = '删除 ' + displayDate(pendingDate) + ' 的' + SLOT_NAME[pendingSlot] + '记录？';
    modalMask.classList.add('show');
  });
  document.getElementById('modalCancel').addEventListener('click', function(){ modalMask.classList.remove('show'); pendingDate = null; pendingSlot = null; });
  modalMask.addEventListener('click', function(e){ if(e.target === modalMask){ modalMask.classList.remove('show'); pendingDate = null; pendingSlot = null; } });
  document.getElementById('modalOk').addEventListener('click', function(){
    if(pendingDate && pendingSlot){
      for(var i = 0; i < records.length; i++){
        if(records[i].date === pendingDate){
          delete records[i][pendingSlot];
          if(!records[i].am && !records[i].pm) records.splice(i, 1);
          break;
        }
      }
      persist();
      renderAll();
      syncInputForDate();
      toast('已删除');
    }
    modalMask.classList.remove('show');
    pendingDate = null;
    pendingSlot = null;
  });

  /* ---------- 备注显示开关 ---------- */
  var noteToggle = document.getElementById('noteToggle');
  noteToggle.checked = showNotes;
  noteToggle.addEventListener('change', function(){
    showNotes = noteToggle.checked;
    try{ localStorage.setItem(PREF_KEY, showNotes ? '1' : '0'); }catch(e){}
    renderHistory();
  });

  /* ---------- 初始化 ---------- */
  function renderAll(){
    renderHero();
    renderStats();
    renderChart();
    renderHistory();
  }

  dateInput.value = fmtDate(new Date());
  setSlot(currentSlot);
  renderAll();

  var rzTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(rzTimer);
    rzTimer = setTimeout(renderChart, 150);
  });
})();
</script>
</body>
</html>
